<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 온도 - 감정 일기장</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1 class="title">🌡️ 마음 온도</h1>
            <p class="subtitle">하루의 감정을 기록하세요</p>
            <div class="api-status" id="apiStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">API 키 확인 중...</span>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 일기 입력 섹션 -->
            <section class="diary-section">
                <div class="input-wrapper">
                    <textarea 
                        id="diaryInput" 
                        class="diary-input" 
                        placeholder="오늘 하루 한 줄을 남겨보세요..."
                        maxlength="500"
                    ></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span>/500
                    </div>
                </div>

                <button id="submitBtn" class="submit-button">
                    <span id="btnText">기록</span>
                    <div id="spinner" class="spinner hidden"></div>
                </button>

                <!-- 분석 결과 표시 -->
                <div id="resultCard" class="result-card hidden">
                    <div class="emotion-result">
                        <div class="emotion-icon" id="emotionIcon">😊</div>
                        <div class="result-details">
                            <h3 id="emotionName">기쁨</h3>
                            <div class="temperature-display">
                                <span class="temp-label">온도:</span>
                                <span id="tempValue" class="temp-value">75°</span>
                            </div>
                            <p id="emotionDescription" class="emotion-desc">따뜻한 감정이 흐르고 있네요.</p>
                        </div>
                    </div>
                    <button id="closeResultBtn" class="close-result">✕</button>
                </div>
            </section>

            <!-- 월별 통계 섹션 -->
            <section class="chart-section">
                <div class="chart-header">
                    <h2>월별 감정 통계</h2>
                    <select id="monthSelect" class="month-selector">
                        <option value="all">전체</option>
                    </select>
                </div>

                <div class="chart-container">
                    <div id="chartWrapper" class="chart-wrapper">
                        <canvas id="emotionChart"></canvas>
                    </div>
                    <div id="emptyState" class="empty-state">
                        <p>📊 통계 데이터를 기다리는 중...</p>
                    </div>
                </div>

                <!-- 통계 요약 -->
                <div class="stats-summary">
                    <div class="stat-card">
                        <span class="stat-label">총 일기</span>
                        <span id="totalDiary" class="stat-value">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">평균 온도</span>
                        <span id="avgTemp" class="stat-value">-°</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">이번 달</span>
                        <span id="thisMonthCount" class="stat-value">0</span>
                    </div>
                </div>
            </section>

            <!-- 최근 기록 목록 -->
            <section class="recent-entries">
                <h2>최근 기록</h2>
                <div id="entriesList" class="entries-list">
                    <div class="empty-entries">기록이 없습니다.</div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
